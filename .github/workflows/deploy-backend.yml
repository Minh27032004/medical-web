# Tự động deploy backend lên Cloud Run khi push vào main có thay đổi trong backend/
# Xác thực bằng Workload Identity Federation (OIDC) — KHÔNG dùng key/secret nào.
# GCP chỉ chấp nhận token OIDC phát ra từ đúng repo Minh27032004/medical-web.
name: Deploy backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {} # cho phép bấm chạy tay trên tab Actions

permissions:
  contents: read
  id-token: write # bắt buộc cho OIDC

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Xác thực Google Cloud (OIDC, không key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/70334084165/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-0a96f6c2-d0b9-44ce-b28.iam.gserviceaccount.com

      - name: Cài gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run
        # Không truyền --set-env-vars: revision mới GIỮ NGUYÊN env vars hiện có
        # (secrets đã set lúc deploy tay lần đầu — không cần nhét vào GitHub)
        run: |
          gcloud run deploy clinic-backend \
            --source backend \
            --region asia-southeast1 \
            --project project-0a96f6c2-d0b9-44ce-b28 \
            --allow-unauthenticated \
            --quiet

      - name: Kiểm tra health sau deploy
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://clinic-backend-70334084165.asia-southeast1.run.app/actuator/health)
          echo "Health: $code"
          test "$code" = "200"
