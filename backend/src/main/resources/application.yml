spring:
  application:
    name: clinic-backend

  config:
    # Dev local: nạp backend/.env (dạng KEY=value) làm property source.
    # Trên Render không có file này → "optional" bỏ qua, đọc từ env vars thật.
    import: optional:file:.env[.properties]

  datasource:
    # BẮT BUỘC dùng Supavisor SESSION mode (port 5432) — xem docs/DECISIONS.md D10
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}

  jpa:
    hibernate:
      ddl-auto: validate # schema do Flyway quản lý, JPA chỉ kiểm tra khớp
    open-in-view: false
    properties:
      hibernate:
        # Gộp lazy-load (units, prescription_items...) thành 1 query IN thay vì N+1 —
        # giảm mạnh số round-trip tới DB Supabase ở xa. Xem MedicineService.toDto/stockDisplay.
        default_batch_fetch_size: 100
        # Log số câu SQL/round-trip mỗi request khi cần soi hiệu năng (tắt mặc định).
        # generate_statistics: true

  jackson:
    deserialization:
      # Field boolean/số nguyên thủy trong DTO record: JSON thiếu/null → coi là giá trị mặc định
      fail-on-null-for-primitives: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  supabase:
    url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    # Project cũ dùng HS256: đặt SUPABASE_JWT_SECRET thay vì JWKS. Ưu tiên JWKS nếu có cả hai.
    jwt-secret: ${SUPABASE_JWT_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # alias luôn trỏ bản flash mới nhất (gemini-2.5-flash bị khóa với API key tạo mới từ 2026)
    model: ${GEMINI_MODEL:gemini-flash-latest}
    # gemini-embedding-001 mặc định 3072 chiều → ép 768 cho khớp cột vector(768)
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    embedding-dimensions: 768
